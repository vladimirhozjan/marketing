<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>WNA Next Today 9x16 main</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter"; src: url("assets/Inter-Bold.ttf") format("truetype"); font-weight: 700; }
      @font-face { font-family: "Inter"; src: url("assets/Inter-SemiBold.ttf") format("truetype"); font-weight: 600; }
      @font-face { font-family: "Montserrat"; src: url("assets/Montserrat.ttf") format("truetype"); font-weight: 100 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a0e1a; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif; }
      .layer { position: absolute; inset: 0; }
      /* TikTok-native POV caption: plain white text with a black outline, top centre */
      #pov {
        position: absolute; left: 90px; right: 90px; top: 300px; text-align: center; opacity: 0;
        font-family: "Inter"; font-weight: 700; font-size: 64px; line-height: 1.2; color: #fff;
        -webkit-text-stroke: 3px #000; paint-order: stroke fill; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      }
      #bg {
        background:
          radial-gradient(ellipse 85% 55% at 50% 66%, rgba(14, 116, 144, 0.6), rgba(10, 14, 26, 0) 70%),
          linear-gradient(180deg, #0a0e1a 0%, #0c1824 55%, #0a0e1a 100%);
      }
      .full { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #shade {
        background: linear-gradient(180deg, rgba(5, 10, 18, 0) 45%, rgba(5, 10, 18, 0.72) 78%, rgba(5, 10, 18, 0.85) 100%);
        opacity: 0;
      }

      /* captions */
      .caps { position: absolute; }
      #cap-ui { left:60px;right:60px;top:170px;height:400px; }
      #cap-full { left:60px;right:60px;top:1240px;height:420px; }
      #cap-card { left:70px;right:70px;top:820px;height:300px; }
      .phrase { position: absolute; inset: 0; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 0 0.26em; }
      #cap-ui .phrase { font-size: 104px; }
      #cap-full .phrase { font-size: 112px; }
      #cap-card .phrase { font-size: 104px; }
      .w {
        display: block; color: #f4f7fb; font-weight: 700; line-height: 1.08; letter-spacing: -0.035em; opacity: 0;
        text-shadow: 0 6px 30px rgba(0, 0, 0, 0.35);
      }
      .w.key { color: #22d3ee; }
      #cap-card .w.key { color: #a5f3fc; }

      /* phone */
      #phone-layer { opacity: 0; }
      #phone {
        position: absolute; left:240px;top:610px;width:600px;height:1267px;
        border-radius: 70px; padding: 13px;
        background: linear-gradient(145deg, #3a3e48, #1b1d22 42%, #0f1116);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 60px 120px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.25);
        transform-origin: 50% 30%;
      }
      #screen { position: relative; width: 100%; height: 100%; border-radius: calc(70px - 13px); overflow: hidden; background: #f3f6f7; }
      #ui { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 0%; }

      /* counter */
      #counter {
        position: absolute; left:690px;top:560px;
        width: 250px; height: 170px; border-radius: 36px; background: #0e7490;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.25);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        transform: scale(1); transform-origin: 50% 50%;
      }
      #counter-inner { display: flex; flex-direction: column; align-items: center; }
      #counter-label { color: rgba(255, 255, 255, 0.82); font-weight: 600; font-size: 30px; letter-spacing: 0.14em; }
      #count { color: #fff; font-weight: 700; font-size: 104px; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }

      /* end card */
      #card { opacity: 0; background: radial-gradient(ellipse 90% 60% at 30% 20%, rgba(34, 211, 238, 0.18), rgba(0, 0, 0, 0) 60%), linear-gradient(160deg, #164e63 0%, #0e7490 100%); }
      #logo {
        position: absolute; left: 50%; top: 520px; width: 220px; height: 220px; margin-left: calc(220px / -2);
        /* G4 logo: white circle with its own shadow baked into the png */
      }
      #url { position: absolute; left: 0; right: 0; top: 1190px; text-align: center; color: #fff; opacity: 0; }
      #url .small { display: block; font-family: "Inter"; font-weight: 600; font-size: calc(58px * 0.62); color: rgba(255, 255, 255, 0.8); letter-spacing: 0.02em; margin-bottom: 10px; }
      #url .big { display: block; font-family: "Montserrat"; font-weight: 700; font-size: 58px; letter-spacing: -0.01em; }
      #next {
        position: absolute; left: 0; right: 0; top: 1640px; text-align: center; opacity: 0;
        font-family: "Inter"; font-weight: 600; font-size: 40px; color: rgba(255, 255, 255, 0.78);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20.5" data-width="1080" data-height="1920">
      <div class="layer" id="bg"></div>

      <video id="h7" class="clip full" src="assets/h7.mp4" muted playsinline data-start="0" data-duration="2.6" data-track-index="0"></video>
      <div class="layer" id="shade"></div>


      <div class="layer" id="phone-layer">
        <div id="phone" data-layout-allow-overflow>
          <div id="screen">

            <video id="ui" class="clip" src="assets/ui.mp4" muted playsinline data-start="2.6" data-duration="11.7" data-track-index="1"></video>
          </div>
        </div>
        <div id="counter">
          <div id="counter-inner">
            <div id="counter-label">NEXT</div>
            <div id="count">20</div>
          </div>
        </div>
        <div class="caps" id="cap-ui">
<div class="phrase" id="p2"><span class="w">Not</span><span class="w">with</span><span class="w">all</span><span class="w key">20.</span></div>
<div class="phrase" id="p3"><span class="w">Pick</span><span class="w">what</span><span class="w">matters</span><span class="w key">today.</span></div>
<div class="phrase" id="p4"><span class="w">Not</span><span class="w">everything.</span><span class="w">Just</span><span class="w key">today.</span></div>
<div class="phrase" id="p5"><span class="w">Finish</span><span class="w key">one.</span><span class="w">Then</span><span class="w">the</span><span class="w">next.</span></div>
        </div>
      </div>

      <div class="caps" id="cap-full">
<div class="phrase" id="p1"><span class="w key">20</span><span class="w">next</span><span class="w">steps.</span><span class="w">Where</span><span class="w">do</span><span class="w">you</span><span class="w">start?</span></div>
      </div>

      <div class="layer" id="card">
        <img id="logo" src="assets/logo.png" alt="" />
        <div class="caps" id="cap-card">
<div class="phrase" id="p6"><span class="w">Know</span><span class="w">your</span><span class="w key">next</span><span class="w key">action.</span></div>
        </div>
        <div id="url"><span class="small">Start free at</span><span class="big">whatsnextaction.com</span></div>
        <div id="next">Next week: waiting on someone?</div>
      </div>

      <audio id="vo" src="assets/vo.wav" data-start="0" data-duration="20.5" data-track-index="2" data-volume="1"></audio>
      <audio id="music" src="assets/music.wav" data-start="0" data-duration="20.5" data-track-index="3" data-volume="0.2"></audio>
    </div>
    <script>
      const T = {"p2": {"s": [2.95, 3.02, 3.38, 3.67], "e": 4.3}, "p3": {"s": [4.48, 4.75, 5.1, 5.71], "e": 8.6}, "p4": {"s": [9.01, 9.15, 10.21, 10.3], "e": 11.3}, "p5": {"s": [11.53, 11.95, 12.58, 12.78, 13.06], "e": 13.9}, "p1": {"s": [0.14, 0.49, 0.77, 1.71, 1.78, 1.84, 2.04], "e": 2.6}, "p6": {"s": [14.2, 14.48, 14.76, 15.07], "e": 20.5}};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#h7", { scale: 1.04 }, { scale: 1.10, duration: 2.6, ease: "none" }, 0);
      tl.set("#shade", { opacity: 1 }, 0); tl.set("#shade", { opacity: 0 }, 2.6);
      tl.fromTo("#phone-layer", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out", immediateRender: false }, 2.5);
      tl.fromTo("#counter-inner", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 2.7);
      const countEl = document.getElementById("count"), labelEl = document.getElementById("counter-label");
      tl.call(() => { labelEl.textContent = "NEXT"; countEl.textContent = "20"; }, null, 0);
      tl.to("#counter-inner", { opacity: 0, duration: 0.15, ease: "none" }, 4.25);
      tl.call(() => { labelEl.textContent = "TODAY"; countEl.textContent = "0"; }, null, 4.4);
      tl.to("#counter-inner", { opacity: 1, duration: 0.2, ease: "none" }, 4.4);
      tl.call(() => { countEl.textContent = "1"; }, null, 5.7);
      tl.call(() => { countEl.textContent = "2"; }, null, 6.75);
      tl.call(() => { countEl.textContent = "3"; }, null, 7.75);
      tl.call(() => { countEl.textContent = "2"; }, null, 12.1);
      tl.fromTo("#card", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 13.85);
      tl.set("#phone-layer", { opacity: 0 }, 14.2);
      tl.fromTo("#logo", { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power2.out" }, 14.0);
      tl.fromTo("#url", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 16.08);
      tl.fromTo("#next", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 17.6);

      // word-by-word captions: pop in on the voice, cut out at phrase end
      Object.keys(T).forEach((id) => {
        const els = document.querySelectorAll("#" + id + " .w");
        T[id].s.forEach((t, i) => {
          tl.fromTo(els[i], { opacity: 0, y: 36, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.16, ease: "back.out(2.2)" }, t);
        });
        if (T[id].e < 20.5) tl.set(els, { opacity: 0 }, T[id].e);
      });

      tl.set({}, {}, 20.5);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
