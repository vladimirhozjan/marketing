<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>WNA Capture test scene</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Inter";
        src: url("assets/Inter-Bold.ttf") format("truetype");
        font-weight: 700;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/Inter-SemiBold.ttf") format("truetype");
        font-weight: 600;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0a0e1a;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Inter", sans-serif;
      }
      #bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 80% 55% at 50% 68%, rgba(14, 116, 144, 0.55), rgba(10, 14, 26, 0) 70%),
          linear-gradient(180deg, #0a0e1a 0%, #0c1824 55%, #0a0e1a 100%);
      }

      /* captions */
      #captions {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 150px;
        height: 400px;
      }
      .phrase {
        position: absolute;
        inset: 0;
        display: flex;
        flex-wrap: wrap;
        align-content: center;
        justify-content: center;
        gap: 0 28px;
      }
      .w {
        display: block;
        color: #f4f7fb;
        font-weight: 700;
        font-size: 112px;
        line-height: 1.08;
        letter-spacing: -0.035em;
        opacity: 0;
      }
      .w.key {
        color: #22d3ee;
      }

      /* phone */
      #phone-wrap {
        position: absolute;
        left: 0;
        right: 0;
        top: 610px;
        height: 1250px;
        display: flex;
        justify-content: center;
      }
      #phone {
        position: relative;
        width: 626px;
        height: 1250px;
        border-radius: 72px;
        padding: 14px;
        background: linear-gradient(145deg, #3a3e48, #1b1d22 42%, #0f1116);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow:
          0 60px 120px rgba(0, 0, 0, 0.55),
          0 0 0 1px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.25);
        transform-origin: 50% 12%;
      }
      #screen {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 58px;
        overflow: hidden;
        background: #f3f6f7;
      }
      #ui {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 0%;
      }
      #island {
        position: absolute;
        left: 50%;
        top: 18px;
        width: 150px;
        height: 42px;
        margin-left: -75px;
        border-radius: 999px;
        background: #050607;
        z-index: 3;
      }

      /* counter */
      #counter {
        position: absolute;
        right: 70px;
        top: 560px;
        width: 250px;
        height: 170px;
        border-radius: 36px;
        background: #0e7490;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.25);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 5;
      }
      #counter-label {
        color: rgba(255, 255, 255, 0.82);
        font-weight: 600;
        font-size: 30px;
        letter-spacing: 0.14em;
      }
      #count {
        color: #ffffff;
        font-weight: 700;
        font-size: 104px;
        line-height: 1;
        letter-spacing: -0.04em;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="7.5"
      data-width="1080"
      data-height="1920"
    >
      <div id="bg"></div>

      <div id="phone-wrap">
        <div id="phone" data-layout-allow-overflow>
          <div id="screen">
            <video
              id="ui"
              class="clip"
              src="assets/typing.mp4"
              muted
              playsinline
              data-start="0"
              data-duration="7.5"
              data-track-index="0"
            ></video>
          </div>
        </div>
      </div>

      <div id="counter">
        <div id="counter-label">INBOX</div>
        <div id="count">24</div>
      </div>

      <div id="captions">
        <div class="phrase" id="p1">
          <span class="w">Type</span><span class="w key">everything.</span>
        </div>
        <div class="phrase" id="p2">
          <span class="w">Don't</span><span class="w key">sort</span><span class="w">it.</span>
        </div>
        <div class="phrase" id="p3">
          <span class="w">Just</span><span class="w">get</span><span class="w">it</span><span class="w key">out.</span>
        </div>
        <div class="phrase" id="p4">
          <span class="w key">All 40.</span><span class="w">Out of your head.</span>
        </div>
      </div>

      <audio
        id="vo"
        src="assets/vo-type.wav"
        data-start="0.4"
        data-duration="2.8"
        data-track-index="2"
        data-volume="1"
      ></audio>
      <audio
        id="music"
        src="assets/music.wav"
        data-start="0"
        data-duration="7.5"
        data-track-index="3"
        data-volume="0.22"
      ></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const VO = 0.4;

      // phone rises in, then punch-in to the input field, then back out
      tl.fromTo("#phone", { y: 160, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo("#counter", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2)" }, 0.35);
      tl.to("#phone", { scale: 1.32, duration: 0.55, ease: "power3.inOut" }, 0.75);
      tl.to("#phone", { scale: 1, duration: 0.6, ease: "power3.inOut" }, 5.5);

      // word-by-word captions, timed to Julian (phrase gaps from silence detection)
      const words = {
        p1: [0.07, 0.36],
        p2: [1.03, 1.3, 1.55],
        p3: [1.95, 2.18, 2.38, 2.52],
        p4: [5.9, 6.35],
      };
      const ends = { p1: 1.0, p2: 1.9, p3: 5.6, p4: 7.5 };
      Object.keys(words).forEach((id) => {
        const els = document.querySelectorAll("#" + id + " .w");
        const base = id === "p4" ? 0 : VO;
        words[id].forEach((t, i) => {
          tl.fromTo(
            els[i],
            { opacity: 0, y: 40, scale: 0.9 },
            { opacity: 1, y: 0, scale: 1, duration: 0.18, ease: "back.out(2.2)" },
            base + t,
          );
        });
        if (ends[id] < 7.5) {
          tl.to(els, { opacity: 0, y: -24, duration: 0.14, ease: "power2.in" }, base + ends[id] - (id === "p3" ? 0.4 : 0.14));
        }
      });

      // inbox counter 24 -> 40, one step per typed entry
      const countEl = document.getElementById("count");
      const proxy = { n: 24 };
      tl.to(
        proxy,
        {
          n: 40,
          duration: 5.0,
          ease: "none",
          onUpdate: () => {
            countEl.textContent = String(Math.round(proxy.n));
          },
        },
        0.9,
      );
      const STEP = 5.0 / 16;
      tl.fromTo("#count", { scale: 1.18 }, { scale: 1, duration: 0.2, ease: "power2.out" }, 0.9 + 0.5 * STEP);
      for (let i = 1; i < 16; i++) {
        tl.fromTo("#count", { scale: 1.18 }, { scale: 1, duration: 0.2, ease: "power2.out", immediateRender: false }, 0.9 + (i + 0.5) * STEP);
      }
      tl.fromTo("#counter", { scale: 1 }, { scale: 1.15, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 5.9);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
