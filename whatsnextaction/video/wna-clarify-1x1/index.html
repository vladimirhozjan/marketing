<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <title>WNA Clarify 1x1 li</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter"; src: url("assets/Inter-Bold.ttf") format("truetype"); font-weight: 700; }
      @font-face { font-family: "Inter"; src: url("assets/Inter-SemiBold.ttf") format("truetype"); font-weight: 600; }
      @font-face { font-family: "Montserrat"; src: url("assets/Montserrat.ttf") format("truetype"); font-weight: 100 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1080px; overflow: hidden; background: #0a0e1a; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif; }
      .layer { position: absolute; inset: 0; }
      #bg {
        background:
          radial-gradient(ellipse 85% 55% at 50% 66%, rgba(14, 116, 144, 0.6), rgba(10, 14, 26, 0) 70%),
          linear-gradient(180deg, #0a0e1a 0%, #0c1824 55%, #0a0e1a 100%);
      }
      .full { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #shade {
        background: linear-gradient(180deg, rgba(5, 10, 18, 0) 45%, rgba(5, 10, 18, 0.72) 78%, rgba(5, 10, 18, 0.85) 100%);
        opacity: 0;
      }

      /* captions */
      .caps { position: absolute; }
      #cap-ui { left:40px;width:520px;top:250px;height:480px; }
      #cap-full { left:50px;right:50px;top:690px;height:300px; }
      #cap-card { left:60px;right:60px;top:410px;height:220px; }
      .phrase { position: absolute; inset: 0; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 0 0.26em; }
      #cap-ui .phrase { font-size: 88px; }
      #cap-full .phrase { font-size: 92px; }
      #cap-card .phrase { font-size: 88px; }
      .w {
        display: block; color: #f4f7fb; font-weight: 700; line-height: 1.08; letter-spacing: -0.035em; opacity: 0;
        text-shadow: 0 6px 30px rgba(0, 0, 0, 0.35);
      }
      .w.key { color: #22d3ee; }
      #cap-card .w.key { color: #a5f3fc; }

      /* phone */
      #phone-layer { opacity: 0; }
      #phone {
        position: absolute; left:585px;top:50px;width:460px;height:971px;
        border-radius: 56px; padding: 13px;
        background: linear-gradient(145deg, #3a3e48, #1b1d22 42%, #0f1116);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 60px 120px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.25);
        transform-origin: 70% 30%;
      }
      #screen { position: relative; width: 100%; height: 100%; border-radius: calc(56px - 13px); overflow: hidden; background: #f3f6f7; }
      #ui { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 0%; }

      /* counter */
      #counter {
        position: absolute; left:420px;top:790px;
        width: 250px; height: 170px; border-radius: 36px; background: #0e7490;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.25);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        transform: scale(0.85); transform-origin: 50% 50%;
      }
      #counter-inner { display: flex; flex-direction: column; align-items: center; }
      #counter-label { color: rgba(255, 255, 255, 0.82); font-weight: 600; font-size: 30px; letter-spacing: 0.14em; }
      #count { color: #fff; font-weight: 700; font-size: 104px; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }

      /* end card */
      #card { opacity: 0; background: radial-gradient(ellipse 90% 60% at 30% 20%, rgba(34, 211, 238, 0.18), rgba(0, 0, 0, 0) 60%), linear-gradient(160deg, #164e63 0%, #0e7490 100%); }
      #logo {
        position: absolute; left: 50%; top: 190px; width: 170px; height: 170px; margin-left: calc(170px / -2);
        /* G4 logo: white circle with its own shadow baked into the png */
      }
      #url { position: absolute; left: 0; right: 0; top: 680px; text-align: center; color: #fff; opacity: 0; }
      #url .small { display: block; font-family: "Inter"; font-weight: 600; font-size: calc(50px * 0.62); color: rgba(255, 255, 255, 0.8); letter-spacing: 0.02em; margin-bottom: 10px; }
      #url .big { display: block; font-family: "Montserrat"; font-weight: 700; font-size: 50px; letter-spacing: -0.01em; }
      #next {
        position: absolute; left: 0; right: 0; top: 930px; text-align: center; opacity: 0;
        font-family: "Inter"; font-weight: 600; font-size: 34px; color: rgba(255, 255, 255, 0.78);
      }
      /* Y / N keys */
      .key-cap {
        position: absolute; width: 140px; height: 140px; border-radius: 30px; opacity: 0;
        background: linear-gradient(180deg, #ffffff 0%, #e6ecef 100%);
        box-shadow: 0 10px 0 #9fb3bb, 0 26px 50px rgba(0, 0, 0, 0.45);
        display: flex; align-items: center; justify-content: center;
        font-family: "Inter"; font-weight: 700; font-size: calc(140px * 0.52); color: #0e7490;
      }
      #keyY { left:60px;top:810px; }
      #keyN { left:240px;top:810px; }
      #flash { background: #fff; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="21.0" data-width="1080" data-height="1080">
      <div class="layer" id="bg"></div>

      <video id="h6" class="clip full" src="assets/h6.mp4" muted playsinline data-start="0" data-duration="2.0" data-track-index="0"></video>
      <div class="layer" id="shade"></div>

      <div class="layer" id="phone-layer">
        <div id="phone" data-layout-allow-overflow>
          <div id="screen">

            <video id="ui" class="clip" src="assets/ui.mp4" muted playsinline data-start="2.0" data-duration="13.2" data-track-index="1"></video>
          </div>
        </div>
        <div id="counter">
          <div id="counter-inner">
            <div id="counter-label">INBOX</div>
            <div id="count">40</div>
          </div>
        </div>
        <div class="key-cap" id="keyY">Y</div>
        <div class="key-cap" id="keyN">N</div>
        <div class="caps" id="cap-ui">
<div class="phrase" id="p2"><span class="w">One</span><span class="w key">question.</span></div>
<div class="phrase" id="p3"><span class="w">Is</span><span class="w">it</span><span class="w key">actionable?</span></div>
<div class="phrase" id="p4"><span class="w">No?</span><span class="w key">Park</span><span class="w">it.</span><span class="w key">File</span><span class="w">it.</span><span class="w key">Trash</span><span class="w">it.</span></div>
<div class="phrase" id="p5"><span class="w">Under</span><span class="w key">2</span><span class="w">minutes?</span></div>
<div class="phrase" id="p6"><span class="w">Don't</span><span class="w">file</span><span class="w">it.</span><span class="w key">Do</span><span class="w">it.</span></div>
<div class="phrase" id="p7"><span class="w">Everything</span><span class="w">else:</span><span class="w">one</span><span class="w key">next</span><span class="w key">step.</span></div>
        </div>
      </div>

      <div class="caps" id="cap-full">
<div class="phrase" id="p1"><span class="w key">40</span><span class="w">things.</span><span class="w">Now</span><span class="w">what?</span></div>
      </div>

      <div class="layer" id="card">
        <img id="logo" src="assets/logo.png" alt="" />
        <div class="caps" id="cap-card">
<div class="phrase" id="p8"><span class="w">Know</span><span class="w">your</span><span class="w key">next</span><span class="w key">action.</span></div>
        </div>
        <div id="url"><span class="small">Start free at</span><span class="big">whatsnextaction.com</span></div>
        <div id="next">Next week: what to do right now.</div>
      </div>

      <div class="layer" id="flash"></div>

      <audio id="vo" src="assets/vo.wav" data-start="0" data-duration="21.0" data-track-index="2" data-volume="1"></audio>
      <audio id="music" src="assets/music.wav" data-start="0" data-duration="21.0" data-track-index="3" data-volume="0.2"></audio>
    </div>
    <script>
      const T = {"p2": {"s": [2.1, 2.35], "e": 3.7}, "p3": {"s": [3.8, 3.95, 4.1], "e": 4.9}, "p4": {"s": [4.95, 5.76, 5.95, 6.39, 6.62, 7.12, 7.45], "e": 8.1}, "p5": {"s": [8.25, 8.65, 8.85], "e": 9.35}, "p6": {"s": [9.45, 9.75, 10.0, 10.46, 10.65], "e": 11.1}, "p7": {"s": [11.3, 11.89, 12.43, 12.69, 13.0], "e": 14.0}, "p1": {"s": [0.05, 0.4, 1.3, 1.55], "e": 2.0}, "p8": {"s": [15.38, 15.6, 15.85, 16.15], "e": 21.0}};
      const tl = gsap.timeline({ paused: true });
      const flash = (t) => tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.85, duration: 0.06, ease: "none", yoyo: true, repeat: 1, immediateRender: false }, t - 0.06);

      tl.fromTo("#h6", { scale: 1.04 }, { scale: 1.10, duration: 2.0, ease: "none" }, 0);
      tl.set("#shade", { opacity: 1 }, 0); tl.set("#shade", { opacity: 0 }, 2.0);
      tl.fromTo("#counter-inner", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 2.1);
      tl.fromTo("#phone-layer", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out", immediateRender: false }, 1.9);
      const countEl = document.getElementById("count");
      tl.call(() => { countEl.textContent = "40"; }, null, 0);
      tl.call(() => { countEl.textContent = "39"; }, null, 5.68);
      tl.call(() => { countEl.textContent = "38"; }, null, 6.62);
      tl.call(() => { countEl.textContent = "37"; }, null, 7.2);
      tl.call(() => { countEl.textContent = "36"; }, null, 10.4);
      tl.call(() => { countEl.textContent = "1"; }, null, 11.2);
      tl.call(() => { countEl.textContent = "0"; }, null, 13.6);
      tl.fromTo("#card", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 15.049999999999999);
      tl.set("#phone-layer", { opacity: 0 }, 15.399999999999999);
      tl.fromTo("#logo", { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power2.out" }, 15.2);
      tl.fromTo("#url", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 17.18);
      tl.fromTo("#next", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 18.6);

      // word-by-word captions: pop in on the voice, cut out at phrase end
      Object.keys(T).forEach((id) => {
        const els = document.querySelectorAll("#" + id + " .w");
        T[id].s.forEach((t, i) => {
          tl.fromTo(els[i], { opacity: 0, y: 36, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.16, ease: "back.out(2.2)" }, t);
        });
        if (T[id].e < 21.0) tl.set(els, { opacity: 0 }, T[id].e);
      });

      tl.set({}, {}, 21.0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
